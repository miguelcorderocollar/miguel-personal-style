<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Miguel personal style studies</title><link rel="stylesheet" href="../personal-style.css"><style>html,body{margin:0}canvas{display:block;width:1920px;height:1080px}p{position:absolute;left:-10000px}</style></head><body class="mcc-style"><canvas id="art" width="1920" height="1080" aria-label="Miguel personal visual style examples"></canvas><p>Personal identity direction studies. Editorial, dark and data compositions.</p><script type="module">
import{drawHalftone,DEFAULT_RECIPE}from'../halftone.js';
const c=document.querySelector('#art').getContext('2d');const ACC='#e8512a',DACC='#ff8561';let mountains,sphereLight,sphereDark;
function text(s,x,y,size=32,weight=500,color='#000',align='left'){c.font=`${weight} ${size}px 'JetBrains Mono'`;c.fillStyle=color;c.textAlign=align;c.textBaseline='top';s.split('\n').forEach((line,i)=>c.fillText(line,x,y+i*size*1.13))}
function line(x1,y1,x2,y2,color='#000',width=2){c.strokeStyle=color;c.lineWidth=width;c.beginPath();c.moveTo(x1,y1);c.lineTo(x2,y2);c.stroke()}
function rect(x,y,w,h,color){c.fillStyle=color;c.fillRect(x,y,w,h)}
function photo(img,x,y,w,h){const iw=img.width,ih=img.height,s=Math.max(w/iw,h/ih);c.drawImage(img,(iw-w/s)/2,(ih-h/s)/2,w/s,h/s,x,y,w,h)}
function header(dark=false,label='PERSONAL NOTES'){const ink=dark?'#d3d3d3':'#000',rule=dark?'#2e2e2e':'#d1d1d1';text('Miguel Cordero Collar',80,55,28,600,ink);text(label,1840,60,24,500,dark?'#aaa':'#666','right');line(80,114,1840,114,rule,2)}
function footer(dark=false,note='DIRECTION STUDY / SAMPLE COPY'){const ink=dark?'#aaa':'#666';line(80,988,1840,988,dark?'#2e2e2e':'#d1d1d1',2);text('miguelcorderocollar.com',80,1017,24,500,ink);text(note,1840,1017,24,500,ink,'right')}
function light(){rect(0,0,1920,1080,'#fff');header();text('01',80,169,34,600,ACC);text('Beyond\nwork.',80,226,152,800);line(1016,180,1016,490,'#d1d1d1',2);text('A few things\nI keep an eye on.',1100,193,32,500);const names=['Trends','People','Quotes'];for(let i=0;i<3;i++){let y=329+i*57;text(`0${i+1}`,1100,y,26,600,ACC);text(names[i],1188,y,28,600);text('↗',1820,y,32,600);line(1100,y+43,1840,y+43,'#d1d1d1',1)}photo(mountains,80,552,1760,388);rect(80,552,8,388,ACC);footer(false,'LIGHT / EDITORIAL OPENER')}
function dark(){rect(0,0,1920,1080,'#000');header(true,'NOTES / 01');text('WHAT IF?',80,175,26,600,DACC);text('What changes\nwhen we try?',80,260,112,800,'#d3d3d3');line(80,582,977,582,DACC,4);text('A better question\nis a useful start.',80,637,36,500,'#aaa');c.drawImage(sphereDark,1120,181,720,720);text('01',1150,873,28,600,DACC);text('A shader study.',1250,876,26,500,'#aaa');footer(true,'DARK / SAMPLE EDITORIAL COPY')}
function data(){rect(0,0,1920,1080,'#fff');header(false,'TRENDS / EXAMPLE');text('Ideas I’m\nfollowing.',80,208,100,800);text('01',80,172,26,600,ACC);text('One signal.\nSome context.',80,488,34,500,'#666');const x=826,y=226,w=1014,h=515;line(x,y+h,x+w,y+h,'#000',2);line(x,y,x,y+h,'#000',2);for(let i=1;i<4;i++)line(x,y+i*h/4,x+w,y+i*h/4,'#d1d1d1',1);const vals=[.14,.17,.18,.28,.24,.37,.44,.42,.59,.55,.72,.84];const pts=vals.map((v,i)=>[x+28+i*(w-56)/11,y+h-35-v*(h-70)]);c.strokeStyle=ACC;c.lineWidth=5;c.beginPath();pts.forEach(([px,py],i)=>i?c.lineTo(px,py):c.moveTo(px,py));c.stroke();const [px,py]=pts.at(-1);c.fillStyle=ACC;c.beginPath();c.arc(px,py,8,0,Math.PI*2);c.fill();text('EXAMPLE SIGNAL',x+25,y-44,24,600);text('EARLIER',x,y+h+20,24,500,'#666');text('LATER',x+w,y+h+20,24,500,'#666','right');text('Illustrative series, not measured data.',x,y+h+57,24,500,'#666');line(80,842,1840,842,'#000',2);text('01  Observe',80,879,32,600);text('02  Test',754,879,32,600);text('03  Update',1408,879,32,600);footer(false,'DATA / LAYOUT STUDY')}
function system(){rect(0,0,1920,1080,'#fff');header(false,'STYLE REFERENCE');text('Personal style,\nin one frame.',80,178,72,800);text('JetBrains Mono',80,397,42,600);text('Medium 500 / SemiBold 600 / ExtraBold 800',80,458,26);text('Aa Bb Cc 0123456789',80,535,48,500);text('→  ↗  π  ∞  { idea }',80,602,40,500);line(80,707,923,707,'#d1d1d1',2);const colors=[['PAPER','#ffffff'],['INK','#090909'],['ACCENT',ACC],['DARK INK','#d3d3d3'],['DARK ACCENT',DACC]];colors.forEach(([name,col],i)=>{let x=80+i*172;rect(x,746,138,76,col);if(col==='#ffffff'){line(x,746,x+138,746,'#d1d1d1',1);line(x,822,x+138,822,'#d1d1d1',1)}text(name,x,839,24,600);text(col,x,878,24,500,'#666')});c.drawImage(sphereLight,1070,214,650,650);text('The site’s shader recipe.',1060,896,26,600);footer(false,'BASE TOKENS + PROPOSED APPLICATIONS')}
window.renderExample=name=>({light,dark,data,system}[name]||light)();
window.__ready=(async()=>{await Promise.all([500,600,800].map(async w=>{if(!(await document.fonts.load(`${w} 40px 'JetBrains Mono'`)).length)throw Error('Font missing '+w)}));await document.fonts.ready;mountains=new Image();mountains.src='../references/site-mountains-halftone.png';await mountains.decode();const source=document.createElement('canvas');source.width=640;source.height=640;let s=source.getContext('2d');s.fillStyle='#fff';s.fillRect(0,0,640,640);const grad=s.createRadialGradient(206,183,12,332,334,286);grad.addColorStop(0,'#fafafa');grad.addColorStop(.45,'#a0a0a0');grad.addColorStop(.8,'#333333');grad.addColorStop(1,'#050505');s.fillStyle=grad;s.beginPath();s.arc(320,320,270,0,Math.PI*2);s.fill();sphereLight=document.createElement('canvas');sphereDark=document.createElement('canvas');for(const canvas of[sphereLight,sphereDark]){canvas.width=640;canvas.height=640;}drawHalftone(sphereLight,source,DEFAULT_RECIPE);drawHalftone(sphereDark,source,{...DEFAULT_RECIPE,ink:'#d3d3d3',paper:'#000000',grain:.025});window.shaderCheck={light:sphereLight.width,dark:sphereDark.width,renderer:'webgl'};window.renderExample(new URLSearchParams(location.search).get('variant')||'light');return true;})();
</script></body></html>
