<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../personal-style.css"><style>body{margin:0}canvas{display:block}</style></head><body class="mcc-style"><canvas id="board" width="2080" height="1490"></canvas><script>
window.__ready=(async()=>{await Promise.all([500,800].map(w=>document.fonts.load(`${w} 40px 'JetBrains Mono'`)));await document.fonts.ready;const c=document.querySelector('canvas').getContext('2d');c.fillStyle='#000';c.fillRect(0,0,2080,1490);c.fillStyle='#d3d3d3';c.font="800 54px 'JetBrains Mono'";c.fillText('Miguel personal style',40,75);c.font="500 26px 'JetBrains Mono'";c.fillStyle='#aaa';c.fillText('Black by default. White for an occasional change of pace.',40,123);const names=['dark','light','data','system'],labels=['A / Black editorial default','B / Occasional white variation','C / Data and trends','D / Type, colour and shader'];for(let i=0;i<4;i++){const img=new Image();img.src=names[i]+'.png';await img.decode();const x=40+(i%2)*1040,y=170+Math.floor(i/2)*675;c.drawImage(img,x,y,960,540);c.strokeStyle='#2e2e2e';c.strokeRect(x,y,960,540);c.fillStyle='#d3d3d3';c.font="800 27px 'JetBrains Mono'";c.fillText(labels[i],x,y+583);}return true;})();
</script></body></html>
